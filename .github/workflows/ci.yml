name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v5.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Install gpgv for independent signature checks
        run: sudo apt-get install -y --no-install-recommends gpgv
      - run: make check-fmt
      - run: make vet
      # Bucket tests skip without CH_DEPLOY_TEST_* variables.
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v5.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: make dist
      - name: Binaries must be static
        run: |
          for f in dist/ch-deploy-linux-*; do
            file "$f"
            file "$f" | grep -q 'statically linked'
          done
      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch-deploy
          path: dist/
